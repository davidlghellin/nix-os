# ~/.config/hypr/hypridle.conf

general {
    ignore_dbus_inhibit = false   # <-- respeta el inhibit (Waybar/portales)
    # opcional:
    # lock_cmd = "pidof hyprlock || hyprlock"
}

# Bloquear a los 5 minutos
listener {
    timeout = 300
    on-timeout = hyprlock
    on-resume  = /run/current-system/sw/bin/notify-send Desbloqueado
}

# Apagar pantalla a los 6 minutos.
# Vía `pantalla` (~/bin) y no `hyprctl dispatch dpms`: este mismo fichero lo usa
# también niri, que arranca hypridle igual, y hyprctl ahí no hace nada — la
# pantalla no se apagaba nunca. El script pregunta qué compositor hay.
listener {
    timeout = 360
    on-timeout = pantalla off
    on-resume  = pantalla on
}
