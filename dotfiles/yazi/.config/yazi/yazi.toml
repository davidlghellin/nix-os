[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true

[preview]
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = '$EDITOR "$@"', block = true, for = "unix" },
]

[plugin]
# `url` y no `name`: yazi lo renombró y con `name` la config entera se
# descarta ("at least one of `url` or `mime` must be specified").
prepend_previewers = [
  { url = "*.md", run = "code" },
]
